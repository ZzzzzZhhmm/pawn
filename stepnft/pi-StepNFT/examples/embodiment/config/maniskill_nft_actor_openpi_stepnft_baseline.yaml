defaults:
  - env/maniskill_put_on_plate_in_scene_25_main@env.train
  - env/maniskill_put_on_plate_in_scene_25_main@env.eval
  - model/pi0@actor.model
  - training_backend/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # Default `all/all/0-1` works for both 4-GPU and 8-GPU runs.
    # Optional optimized presets can be injected without editing the file:
    # 4-GPU: PLACEMENT_ACTOR=0-3 PLACEMENT_ROLLOUT=2-3 PLACEMENT_ENV=0-1
    # 8-GPU: PLACEMENT_ACTOR=0-7 PLACEMENT_ROLLOUT=2-5 PLACEMENT_ENV=0-1
    actor: ${oc.env:PLACEMENT_ACTOR,all}
    rollout: ${oc.env:PLACEMENT_ROLLOUT,all}
    env: ${oc.env:PLACEMENT_ENV,0-1}

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "maniskill_nft_actor_openpi_stepnft_baseline"
    logger_backends: ["tensorboard"]

  max_epochs: 200
  max_steps: -1
  only_eval: False
  val_check_interval: -1
  save_interval: 20
  save_last_n_steps: 10
  eval_last_every_k_steps: 2

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 32
  reward_coef: 1.0

  rollout_epoch: 10
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: token_level
  entropy_type: chunk_level
  update_epoch: 5

  adv_type: terminal-binary
  loss_type: nft-actor
  loss_agg_func: "token-mean"

  kl_beta: 0.0001
  nft_beta: 1.0
  clip_ratio_high: 1.0

  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95

  base: 0.1
  target: 0.995

  filter_rewards: False
  rewards_lower_bound: 0.0
  rewards_upper_bound: 1.0

  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False
  train:
    total_num_envs: 128
    group_size: ${algorithm.group_size}
    auto_reset: False
    use_fixed_reset_state_ids: False
    max_episode_steps: 60
    max_steps_per_rollout_epoch: 60
    video_cfg:
      save_video: False

  eval:
    total_num_envs: 320
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 80
    max_steps_per_rollout_epoch: 80
    use_fixed_reset_state_ids: True
    group_size: 1
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: "/path/to/model/RLinf-Pi0-ManiSkill-25Main-SFT"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 32
  global_batch_size: 2560
  seed: 0
  enable_offload: False

  model:
    model_path: "/path/to/model/RLinf-Pi0-ManiSkill-25Main-SFT"
    model_name: "openpi"
    precision: null
    num_action_chunks: 5
    action_dim: 7
    add_value_head: False
    openpi:
      config_name: "pi0_maniskill"
      num_images_in_input: 1
      noise_method: "flow_noise"
      action_horizon: 8
      detach_critic_input: True
      joint_logprob: False
      value_after_vlm: False
      use_nft_loss: True
      solver_type: "flow_sde"
      noise_level: 0.2

    policy_setup: widowx_bridge

  optim:
    lr: 8e-6
    value_lr: 1.55e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False

