defaults:
  - env@env.train: libero_spatial
  - env@env.eval: libero_spatial
  - model@actor.model: pi0
  - training_backend@actor.fsdp_config: fsdp
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null

cluster:
  num_nodes: 1
  component_placement:
    # Default `all/all/0-1` works for both 4-GPU and 8-GPU runs.
    # Optional optimized presets can be injected without editing the file:
    # 4-GPU: PLACEMENT_ACTOR=0-3 PLACEMENT_ROLLOUT=2-3 PLACEMENT_ENV=0-1
    # 8-GPU: PLACEMENT_ACTOR=0-7 PLACEMENT_ROLLOUT=2-5 PLACEMENT_ENV=0-1
    actor: ${oc.env:PLACEMENT_ACTOR,all}
    rollout: ${oc.env:PLACEMENT_ROLLOUT,all}
    env: ${oc.env:PLACEMENT_ENV,0-1}

runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:PAWN_OUTPUT_DIR,outputs}
    project_name: pawn
    experiment_name: "libero_spatial_nft_actor_openpi"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 200
  max_steps: -1

  only_eval: False
  val_check_interval: -1
  save_interval: 15

  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 32
  reward_coef: 1.0
  rollout_epoch: 8
  eval_rollout_epoch: 1

  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 2
  adv_type: dual-credit
  loss_type: nft-dual-credit
  loss_agg_func: "token-mean"

  kl_beta: 0.0001
  nft_beta: 1.0
  clip_ratio_high: 1.0

  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95

  base: 0.1
  target: 0.995

  # Dual-credit PRM config
  prm_lr: 1.0e-5
  prm_update_epochs: 1
  prm_energy_batch_size: 4
  prm_beta: 0.0005
  prm_score_mode: prefix_weighted_mean
  prm_pair_mode: dual_head_hard_topk
  prm_hard_negative_k: 2
  prm_hard_negative_semantic_k: 1
  prm_hard_negative_quality_k: 1
  prm_hard_negative_shortlist_k: 4
  prm_hard_negative_fail_reuse_cap: 3
  prm_pair_embed_source: ref_suffix
  prm_pair_sim_metric: cosine
  prm_pos_top_ratio: 0.9
  prm_pos_min_count: 5
  prm_semantic_tail_weight: 0.5
  prm_semantic_early_penalty_weight: 0.75
  prm_semantic_early_threshold: 0.85
  prm_semantic_early_prefix_frac: 0.4
  prm_quality_semantic_min: 0.9
  prm_quality_early_penalty_max: 0.003
  prm_quality_mid_target: 0.9
  prm_quality_mid_width: 0.08
  prm_quality_weight_midband: 1.0
  prm_quality_weight_action_path: 1.0
  prm_quality_weight_action_reversal: 0.75
  prm_quality_weight_action_gripper: 0.5
  prm_quality_weight_action_continuity: 0.5
  prm_quality_weight_state_path: 1.0
  prm_quality_weight_state_reversal: 0.75
  prm_quality_weight_state_gripper: 0.5
  prm_pair_weighting: true
  prm_pair_weight_min: 0.05
  prm_pair_weight_rho: 1.0
  prm_margin_weight_temp: 3.0
  prm_margin_weight_gamma: 1.0
  prm_synthetic_pair_weight: 1.5

  # PRM-only near-miss branch augmentation
  enable_branch_rollout: true
  branch_plans_per_group: 1
  branch_delta_scale: 0.7
  branch_jitter_scale: 0.05
  branch_recipe_bank_size: 64

  # Chunk gate config
  gate_eta_min: 0.1
  gate_eta_max: 1.0
  gate_tau_phi: 1.0

  # Dual-credit loss weights
  lambda_phi: 1.0
  lambda_phi_init: 0.2
  pair_guidance_lambda_init: 0.02
  guidance_lambda_start_step: 20
  guidance_lambda_end_step: 50
  lambda_tr: 0.001
  dual_credit_inner_batch_cap: 8

  # Block-NFT semantic chunk guidance
  enable_block_nft: true
  block_nft_axis_mix: 0.5
  block_nft_tau_block: 0.1
  block_nft_tau_axis: 0.1
  block_nft_guidance_mode: blended

  # Local pair-guidance over denoising suffixes
  enable_pair_guidance: true
  pair_guidance_num_samples: 4
  pair_guidance_delta_thresh: 3.0e-4
  pair_guidance_lambda: 0.2
  pair_guidance_kappa: 1.0

  # Ablation switches
  enable_chunk_term: true
  enable_gate: true
  empty_cache_every_n_batches: 0

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: True
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: False

  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1

env:
  group_name: "EnvGroup"
  enable_offload: False

  train:
    total_num_envs: 64
    group_size: ${algorithm.group_size}
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
  eval:
    total_num_envs: 500
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 240
    max_steps_per_rollout_epoch: 240
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    video_cfg:
      save_video: True
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1

  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 64
  global_batch_size: 1024
  seed: 42
  enable_offload: False

  model:
    model_path: ${oc.env:PAWN_MODEL_PATH,checkpoints/RLinf-Pi0-SFT-Spatial-Object-Goal}
    num_action_chunks: 5
    add_value_head: False
    openpi:
      detach_critic_input: True
      use_nft_loss: True
      solver_type: "flow_sde"
      noise_level: 0.2
      store_full_solver_path: true

  optim:
    lr: 1.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
