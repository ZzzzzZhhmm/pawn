[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pawn"
version = "0.1.0"
description = "Preference-Aware Semantic NFT for flow-based vision-language-action policies"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "accelerate",
    "ray[default]>=2.47.0",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy>=1.26,<2",
    "hydra-core==1.4.0.dev1",
    "omegaconf>=2.3",
    "einops",
    "tensordict",
    "imageio[ffmpeg]",
    "cloudpickle",
    "scipy",
    "psutil",
    "packaging",
    "pillow",
    "pyyaml",
    "tqdm",
    "typing-extensions",
    "tensorboard",
    "nvidia-ml-py",
    "nvitop",
    "icmplib",
    "torch-memory-saver",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "build"]
logging = ["wandb", "swanlab>=0.6.11"]
lora = ["peft==0.11.1"]

[tool.setuptools.packages.find]
include = ["rlinf*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741", "F841"]
isort = {known-first-party = ["rlinf"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
